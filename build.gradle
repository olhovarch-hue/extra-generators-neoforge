plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

// Expand the metadata template into the location NeoForge expects in the JAR.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'    : mod_name,
            'Specification-Vendor'   : 'Extra Generators NeoForge port',
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.version,
        ])
    }
}


// Generate the data-driven block resources from a compact manifest. PNG textures
// are supplied separately and are intentionally not generated by this task.
def generateGeneratorResources = tasks.register('generateGeneratorResources') {
    def manifestFile = layout.projectDirectory.file('src/main/resource_templates.json')
    def outputDir = layout.buildDirectory.dir('generated/resources/generatorAssets')
    inputs.file(manifestFile)
    outputs.dir(outputDir)
    doLast {
        def resources = new groovy.json.JsonSlurper().parse(manifestFile.asFile)
        resources.each { relativePath, contents ->
            def target = new File(outputDir.get().asFile, relativePath.toString())
            target.parentFile.mkdirs()
            target.setText(contents.toString(), 'UTF-8')
        }
    }
}
sourceSets.main.resources.srcDir generateGeneratorResources
